[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsnewai"
version = "0.1.0"
description = "Local-first conference-paper research platform: install, serve on your LAN, connect your coding agent"
requires-python = ">=3.10"
# The SERVING layer is stdlib-only by design — it must run on machines that
# cannot run the build pipeline (Windows, no GPU). Pipeline deps live in .venv.
dependencies = []

[project.scripts]
# provisional name — tracks the pending repo rename; this line is the rename
wnai = "wnai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wnai*"]
