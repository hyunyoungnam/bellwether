<!doctype html><html><head><meta charset="utf-8"><title>Bellwether /browse audit</title>
<style>
body{margin:0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#111;color:#ddd}
#out{padding:12px 16px;white-space:pre-wrap}
.p{color:#7fd18a}.f{color:#ff8f70;font-weight:700}
h2{font:600 14px system-ui;margin:14px 0 6px;color:#9ab}
iframe{position:fixed;right:0;bottom:0;width:1100px;height:800px;border:1px solid #333;
  transform:scale(.32);transform-origin:bottom right;opacity:.45}
</style></head><body>
<div id="out">running…</div>
<!-- holds the load event open so a headless --screenshot waits for the run -->
<img src="/slow?s=50" style="display:none" alt="">
<iframe id="f" src="/browse"></iframe>
<script>
// The evidence surface, driven the same way: a cite chip lands here, so the
// deep link, the search, and the selection have to work from a cold load.
const out=document.getElementById('out'); let pass=0,fail=0;
const line=(ok,name,note)=>{ ok?pass++:fail++;
  out.insertAdjacentHTML('beforeend',
    `<div class="${ok?'p':'f'}">${ok?'PASS':'FAIL'}  ${name}${note?'  — '+note:''}</div>`); };
const head=s=>out.insertAdjacentHTML('beforeend',`<h2>${s}</h2>`);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const W=()=>f.contentWindow, D=()=>f.contentDocument;
const q=s=>D().querySelector(s);
const all=s=>[...D().querySelectorAll(s)];
// a hash-only change is a same-document navigation and fires no load event —
// go through the iframe's own location so the page really reloads
// a fragment-only change is a same-document navigation: no load event, and
// the page's own popstate handler runs instead. Force a real load.
async function load(path){
  await new Promise(r=>{ f.onload=r; f.src='about:blank'; });
  return new Promise(r=>{ f.onload=()=>setTimeout(r,2800); f.src=path; });
}

async function run(){
  out.innerHTML='';
  await new Promise(r=>{ if(D()&&D().readyState==='complete')r(); else f.onload=r; });
  await sleep(2500);

  head('landing');
  line(all('.vcard,[data-corp]').length>0,'venue cards render',
       all('.vcard,[data-corp]').length+' cards');
  line(!q('.p'),'no papers are listed before the reader narrows');
  const home=q('#homelink');
  line(home&&!home.hidden,'the home link shows when served at /browse');
  line(home&&new URL(home.href).pathname==='/','and it points at the conversation');

  head('search');
  // search commits on Enter by design — typing is a draft, not a filter
  const enter=()=>q('#q').dispatchEvent(
    new (W().KeyboardEvent)('keydown',{key:'Enter',bubbles:true}));
  const inp=q('#q'); inp.value='autonomous driving'; enter();
  await sleep(3000);
  const hits=all('.p').length;
  line(hits>0,'a query returns result cards',hits+' cards');
  const stamps=all('.p').slice(0,6).map(e=>e.textContent)
    .filter(t=>/ICML|NeurIPS|ICLR/.test(t)).length;
  line(stamps>0,'results carry a venue-year stamp',stamps+'/6 checked');
  line(!!q('[data-fc="q"]'),'the query stays on screen as a removable chip');

  head('the set as a table');
  const vw=v=>[...D().querySelectorAll('[data-vw]')].find(b=>b.dataset.vw===v);
  line(all('[data-vw]').length===4,'the set offers four views',
       all('[data-vw]').map(b=>b.textContent).join('/'));
  vw('table').click(); await sleep(900);
  const rows=all('.tbl tbody tr');
  line(rows.length>0,'the table renders one row per paper',rows.length+' rows');
  line(all('.tbl thead th').length===6,'with the extracted fields as columns',
       all('.tbl thead th').map(e=>e.textContent.trim()).join('/'));
  line(!!q('.tbcov'),'and states its coverage',(q('.tbcov')||{}).textContent);
  const before=all('.tbl tbody tr td.tt').map(e=>e.textContent.trim()).slice(0,3).join('|');
  q('.tbl thead th[data-sc="p"]').click(); await sleep(700);
  const after=all('.tbl tbody tr td.tt').map(e=>e.textContent.trim()).slice(0,3).join('|');
  line(before!==after,'a column header sorts the table');
  const named=all('.tbl tbody tr').slice(0,5)
    .every(r=>r.children[2].textContent.trim().length>0);
  line(named,'sorting puts the named ones first, never the empty ones');
  q('.tbl thead th[data-sc="p"]').click(); await sleep(400);
  q('.tbl thead th[data-sc="p"]').click(); await sleep(600);   // back to no sort

  head('the reading queue');
  const first=q('.tbl tbody tr');
  const gidRow=first.dataset.tr;
  first.querySelector('.mk [data-m="r"]').click(); await sleep(700);
  line(!!q('.tbl tbody tr.mr, .tbl tbody tr .mk button.on.mr'),'a paper can be marked read');
  line(!!q('.mkbar'),'the set shows progress through itself',(q('.mkn')||{}).textContent);
  const row2=all('.tbl tbody tr')[1];
  row2.querySelector('.mk [data-m="x"]').click(); await sleep(700);
  const hidebtn=q('#hidex');
  line(!!hidebtn,'excluded papers can be hidden');
  const gone=row2.dataset.tr, setN=(q('.scn')||{}).textContent;
  hidebtn.click(); await sleep(800);
  line(!q(`.tbl tbody tr[data-tr="${gone}"]`),'and hiding takes that paper off the list');
  line((q('.scn')||{}).textContent===setN,
       'while the set count still says how big the set is',setN);
  q('#hidex').click(); await sleep(600);
  // marks survive a reload, and the audit cleans up after itself
  W().localStorage.removeItem('bw_marks');
  vw('cards').click(); await sleep(600);
  line(!!q('.p'),'the switch goes back to cards');

  head('the set as a map');
  vw('map').click(); await sleep(2500);
  const dots=all('.dot');
  line(dots.length>0,'the selection is placed by its own vectors',dots.length+' dots');
  line(!!q('.tbcov'),'and says how many it could place',(q('.tbcov')||{}).textContent);
  line(!/drag|click|hover/i.test((q('.tbcov')||{}).textContent||''),
       'the caption states coverage, not instructions');
  line(new Set(dots.slice(0,40).map(d=>d.getAttribute('fill'))).size<=3,
       'venue is the only hue, three at most');
  // a box over the left half must narrow the set to what is inside it
  const svg=q('#mapsvg'), r=svg.getBoundingClientRect();
  const PE=W().PointerEvent;
  const at=(ty,x,y)=>new PE(ty,{clientX:x,clientY:y,bubbles:true,pointerId:1});
  const down=at('pointerdown',r.left+8,r.top+8);
  const move=at('pointermove',r.left+r.width*0.5,r.top+r.height*0.9);
  const up=at('pointerup',r.left+r.width*0.5,r.top+r.height*0.9);
  const before2=W().BW.set.length;
  svg.dispatchEvent(down); svg.dispatchEvent(move); svg.dispatchEvent(up);
  await sleep(1500);
  line(W().BW.set.length<before2,'a box drawn on the map narrows the set',
       before2+' -> '+W().BW.set.length);
  line(!!q('[data-fc="z"]'),'and the box is a removable chip like every other pick');
  q('[data-fc="z"]').click(); await sleep(1200);
  line(W().BW.set.length===before2,'removing it restores the set',
       W().BW.set.length+'');
  vw('table').click(); await sleep(700);

  head('the way out');
  line(all('[data-ex]').length===2,'the set can leave as .bib or .csv');
  const gids=W().BW.set.slice(0,4).map(i=>W().BW.P[i].i);
  const rb=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({gids,fmt:'bib'})});
  const bib=await rb.text();
  line(rb.ok&&(bib.match(/@inproceedings/g)||[]).length===gids.length,
       'bibtex comes back with one entry per paper',
       (bib.match(/@inproceedings/g)||[]).length+' entries');
  const rc=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({gids,fmt:'csv'})});
  const csv=await rc.text();
  line(rc.ok&&csv.split('\n').length-1>=gids.length,'and csv with one row per paper');

  head('deep link from a cite chip');
  await load('/browse#p19662');
  line(!!q('.p.sel'),'the linked paper is selected on the ALL screen',
       D().querySelectorAll('.p').length+' cards');
  line(/MiniCache/.test(D().body.textContent),'and it is the paper the link named');
  await sleep(1500);   // the card's sentences are an on-demand part
  const marks=all('.p.sel .wL,.p.sel .wK,.p.sel .wR,.p.sel .hl,.p.sel mark').length;
  line(marks>0,'its passage is unfolded, in the three colours',marks+' spans');

  head('back button');
  W().history.pushState(null,'','#all'); W().history.back(); await sleep(1200);
  line(/MiniCache/.test(D().body.textContent),
       'returning to a paper address reopens that paper, not the landing');

  head('a paper opens its neighbours');
  const nb=q('[data-panel],.nb,.simbtn');
  if(nb){ nb.click(); await sleep(1200);
    line(!q('#panel').hidden,'the similar panel opens'); }
  else line(true,'similar control not present on this card (skipped)');

  const sum=`browse_audit: ${pass}/${pass+fail} passed${fail?`  ·  ${fail} FAILED`:''}`;
  out.insertAdjacentHTML('beforeend',`<h2>${sum}</h2>`);
  // the harness runs inside the page — send the verdict where a terminal can read it
  fetch('/slow?report='+encodeURIComponent(sum));
}
run().catch(e=>line(false,'audit crashed',String(e)));
</script></body></html>
