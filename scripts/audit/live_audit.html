<!doctype html><html><head><meta charset="utf-8"><title>Bellwether live audit</title>
<style>
body{margin:0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#111;color:#ddd}
#out{padding:12px 16px;white-space:pre-wrap}
.p{color:#7fd18a}.f{color:#ff8f70;font-weight:700}
h2{font:600 14px system-ui;margin:14px 0 6px;color:#9ab}
iframe{position:fixed;right:0;bottom:0;width:900px;height:700px;border:1px solid #333;
  transform:scale(.42);transform-origin:bottom right;opacity:.5}
</style></head><body>
<div id="out">running…</div>
<!-- two real agent runs happen here; hold the load event open for both -->
<img src="/slow?s=300" style="display:none" alt="">
<iframe id="f" src="/"></iframe>
<script>
// The generation path, for real: one answer end to end, one answer stopped.
// Everything it creates is deleted at the end.
const out=document.getElementById('out'); let pass=0,fail=0;
const line=(ok,name,note)=>{ ok?pass++:fail++;
  out.insertAdjacentHTML('beforeend',
    `<div class="${ok?'p':'f'}">${ok?'PASS':'FAIL'}  ${name}${note?'  — '+note:''}</div>`); };
const head=s=>out.insertAdjacentHTML('beforeend',`<h2>${s}</h2>`);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const W=()=>f.contentWindow, D=()=>f.contentDocument;
const q=s=>D().querySelector(s);
const idsBefore=async()=>new Set((await (await fetch('/chats')).json()).map(r=>r.id));

async function run(){
  out.innerHTML='';
  await new Promise(r=>{ if(D()&&D().readyState==='complete')r(); else f.onload=r; });
  await sleep(800);
  const w=W();
  const before=await idsBefore();

  head('one answer, end to end');
  // one tool, one anchor, one short answer — enough to exercise the whole path
  w.send('Find one paper about KV cache compression and give its key change '
        +'in one sentence, with the anchor.');
  await sleep(1200);
  line(w.BW.busy,'the composer goes into stop mode while it works');
  line(q('#go').textContent==='■','the ask button becomes a stop button');
  line(!!q('.live'),'the trail starts immediately');
  await sleep(2500);
  line(/\d+s/.test((q('.live .el')||{}).textContent||''),'the trail counts elapsed seconds',
       (q('.live .el')||{}).textContent);
  for(let i=0;i<50&&w.BW.busy;i++)await sleep(2000);
  line(!w.BW.busy,'the run finishes');
  line(!!q('.amsg'),'an answer is rendered');
  line(q('#go').textContent==='↑','the button goes back to ask');
  line(!!q('.afoot'),'the answer carries its footer');
  const after=await (await fetch('/chats')).json();
  const fresh=after.filter(r=>!before.has(r.id));
  line(fresh.length===1,'the conversation is saved once',fresh.length+' new');
  line(!!q('.hrow.on'),'and appears in the rail, marked as open');
  line(w.location.hash==='#c'+w.BW.chat,'with its own address',w.location.hash);

  head('what the turn keeps');
  const cid=w.BW.chat;
  const doc=await (await fetch('/chats/'+cid)).json();
  const t0=doc.turns[0];
  line((t0.trail||[]).length>0,'the tool trail is stored with the turn',
       (t0.trail||[]).length+' steps');
  line(!!(t0.on&&t0.on.papers),'and what it was answered against',
       JSON.stringify(t0.on||{}).slice(0,60));
  await w.openChat(cid); await sleep(700);
  line(!!q('.trail'),'so reopening the conversation still shows how it got there');

  head('figures, recomputed');
  q('#newq').click(); await sleep(300);
  w.send('gap_scan을 healthcare에 돌려서, 가장 많이 지적되지만 거의 공략되지 '
        +'않는 실패 하나를 수치와 함께 한 문단으로 알려줘.');
  for(let i=0;i<60&&w.BW.busy;i++)await sleep(2000);
  const figs=[...D().querySelectorAll('.fig')];
  line(figs.length>0,'the agent anchors the figures it states',figs.length+' figure chips');
  line(figs.some(f=>f.classList.contains('ok')),'and they survive recomputation',
       figs.map(f=>f.className.replace('fig ','')).join(','));
  const fdoc=await (await fetch('/chats/'+w.BW.chat)).json();
  const fseg=(fdoc.turns[0].segs||[]).filter(x=>x.t==='n');
  line(fseg.every(x=>x.tool&&x.arg),'each figure keeps the tool and argument it came from',
       fseg.map(x=>x.tool+':'+x.arg).slice(0,2).join(' · '));
  line((fdoc.turns[0].verified||{}).fchecked>0,'and the turn counts them apart from quotes',
       JSON.stringify(fdoc.turns[0].verified));
  const fresh3=[fdoc];

  head('a run the reader calls off');
  const before2=new Set((await (await fetch('/chats')).json()).map(r=>r.id));
  q('#newq').click(); await sleep(300);
  w.send('자율주행 분야의 블루오션을 갭 스캔으로 찾아줘.');
  await sleep(6000);
  line(w.BW.busy,'the second run is under way');
  q('#go').click();                       // the stop button
  for(let i=0;i<20&&w.BW.busy;i++)await sleep(1000);
  line(!w.BW.busy,'stopping ends the run');
  line(!!q('.stopped'),'and says so where the answer would have been',
       (q('.stopped')||{}).textContent);
  const after2=await (await fetch('/chats')).json();
  const fresh2=after2.filter(r=>!before2.has(r.id));
  line(fresh2.length===0,'a stopped run saves nothing',fresh2.length+' new');

  head('cleanup');
  for(const r of fresh)await fetch('/chats/'+r.id,{method:'DELETE'});
  for(const r of fresh2)await fetch('/chats/'+r.id,{method:'DELETE'});
  for(const r of fresh3)await fetch('/chats/'+r.id,{method:'DELETE'});
  const end=await (await fetch('/chats')).json();
  line(end.length===before.size,'the audit leaves no conversations behind',
       end.length+' vs '+before.size);

  const sum=`live_audit: ${pass}/${pass+fail} passed${fail?`  ·  ${fail} FAILED`:''}`;
  out.insertAdjacentHTML('beforeend',`<h2>${sum}</h2>`);
  // the harness runs inside the page — send the verdict where a terminal can read it
  fetch('/slow?report='+encodeURIComponent(sum));
}
run().catch(e=>line(false,'audit crashed',String(e)));
</script></body></html>
