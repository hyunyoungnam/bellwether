<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellwether</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--ink:#1c1e21;--ink2:#43474d;--mut:#9096a0;--ring:#e4e6ea;
  --acc:#2f6fe4;--ok:#2e7d32;--no:#b3452c;--hp:#f2b8c6;--hy:#f2d478;--hb:#a8cdf0;
  --bub:#1c1e21;--bubfg:#fff}
html[data-theme="dark"]{--bg:#17181b;--card:#212327;--ink:#e9eaee;--ink2:#c3c7cf;--mut:#82878f;
  --ring:#33363c;--acc:#5b8ff0;--ok:#6fbf73;--no:#e08a72;--hp:#7a4553;--hy:#7a6a33;--hb:#3d5a75;
  --bub:#e9eaee;--bubfg:#17181b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15.5px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
.app{display:grid;grid-template-columns:304px 1fr;height:100%}
@media(min-width:1200px){.app.wside{grid-template-columns:304px 1fr 340px}}

/* ---- rail ---- */
.rail{background:var(--card);border-right:1px solid var(--ring);display:flex;flex-direction:column;
  padding:18px 14px 14px;min-height:0}
.mark{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;
  letter-spacing:-.01em;padding:2px 6px 12px}
.mark i{width:9px;height:9px;border-radius:3px;display:inline-block}
.mark i:nth-child(1){background:var(--hp)}.mark i:nth-child(2){background:var(--hy);margin-left:-4px}
.mark i:nth-child(3){background:var(--hb);margin-left:-4px}
.mark span{display:flex;flex-direction:column;line-height:1.15}
.mark em{font-style:normal;font-weight:600;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut)}
.newq{font:inherit;font-weight:650;font-size:15.5px;border:1px solid var(--ring);background:var(--bg);
  color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
.newq:hover{border-color:var(--acc)}
.hist{flex:1;overflow-y:auto;margin-top:14px;scrollbar-width:thin;min-height:0}
.hgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);
  margin:10px 6px 4px}
.hrow{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink2);
  background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow:hover{background:var(--bg)}
.hrow.on{background:var(--bg);color:var(--ink);font-weight:600}
.railfoot{border-top:1px solid var(--ring);padding-top:10px;margin-top:8px}
.railfoot a{display:block;font-size:15px;color:var(--ink2);text-decoration:none;
  border-radius:8px;padding:7px 8px}
.railfoot a:hover{background:var(--bg)}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{display:none}}

/* ---- thread ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.thread{flex:1;overflow-y:auto;min-height:0}
.tin{max-width:800px;margin:0 auto;padding:28px 20px 24px}
.qmsg{display:flex;justify-content:flex-end;margin:26px 0 14px}
.qmsg>div{background:var(--bub);color:var(--bubfg);border-radius:14px 14px 4px 14px;
  padding:9px 15px;max-width:80%;white-space:pre-wrap}
.amsg{margin:0 0 6px;white-space:pre-wrap}
.afoot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);margin:8px 0 0}
.vok{color:var(--ok);font-weight:650}
.vno{color:var(--no);font-weight:650}
.trail{margin:6px 0 0}
.trail summary{cursor:pointer;list-style:none;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--mut)}
.trail summary::before{content:'▸ '}
.trail[open] summary::before{content:'▾ '}
.trail div{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);padding:2px 0 0 14px}
.live{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);padding:2px 0}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);
  margin-right:8px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}
.cite{display:inline-block;font:inherit;font-size:12.5px;background:var(--card);border:1px solid var(--ring);
  border-radius:7px;padding:1.5px 8px;margin:1px 2px;vertical-align:1px;max-width:330px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.cite b{font-weight:700;margin-right:5px}
.cite.ok b{color:var(--ok)}
.cite.no{border-color:#e0b4a6}.cite.no b{color:var(--no)}
/* the quote's role wears the card's own colour */
.cite.rL{background:color-mix(in srgb,var(--hp) 32%,var(--card))}
.cite.rK{background:color-mix(in srgb,var(--hy) 36%,var(--card))}
.cite.rR{background:color-mix(in srgb,var(--hb) 34%,var(--card))}
.cite:hover{border-color:var(--acc)}
.errmsg{color:var(--no);font-size:14px}
.draft{white-space:pre-wrap;color:var(--ink2);margin:4px 0 6px}
.draft::after{content:'▍';color:var(--acc);animation:pulse 1s infinite alternate}
.hwrap{position:relative}
.hact{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;gap:2px}
.hwrap:hover .hact{display:flex}
.hact button{font:inherit;font-size:12px;border:0;background:var(--bg);color:var(--mut);
  border-radius:6px;width:22px;height:22px;cursor:pointer}
.hact button:hover{color:var(--ink)}
.hwrap:hover .hrow{background:var(--bg)}
.menubtn{display:none;position:fixed;top:10px;left:10px;z-index:30;font:inherit;font-size:17px;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--ring);background:var(--card);
  color:var(--ink);cursor:pointer}
@media(max-width:900px){
  .menubtn{display:block}
  .rail{display:none}
  .rail.open{display:flex;position:fixed;top:0;bottom:0;left:0;width:min(320px,85vw);
    z-index:25;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .tin{padding-top:58px}
  .hero{padding-top:48px}
}

/* ---- inline highlight card, unfolded under the answer ---- */
.pcard{background:var(--card);border:1px solid var(--ring);border-radius:12px;
  padding:14px 16px;margin:8px 0 10px;white-space:normal}
.pcard .pt{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.pcard .pt a{color:inherit;text-decoration:none}
.pcard .pt a:hover{color:var(--acc)}
.pcard .pv{font-size:12.5px;color:var(--mut);margin:2px 0 10px}
.pcard .pv b{color:var(--ink2);font-weight:650}
.pcard .pass{font-size:14.5px;line-height:1.8}
.pcard .pass i{font-style:normal;padding:1px 3px;border-radius:3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.pcard .pass i.wL{background:color-mix(in srgb,var(--hp) 42%,transparent)}
.pcard .pass i.wK{background:color-mix(in srgb,var(--hy) 48%,transparent)}
.pcard .pass i.wR{background:color-mix(in srgb,var(--hb) 44%,transparent)}

/* ---- right panel: the agent's working set, one structured card at a time */
.side{display:none;border-left:1px solid var(--ring);background:var(--card);
  flex-direction:column;min-height:0;overflow:hidden}
@media(min-width:1200px){.app.wside .side{display:flex}}
.shd{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);
  padding:16px 16px 8px}
.shd b{color:var(--ink2);font-weight:650;margin-left:4px}
.ptabs{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px;border-bottom:1px solid var(--ring)}
.ptab{font:inherit;font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--ring);
  border-radius:6px;padding:2px 8px;cursor:pointer;max-width:130px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ptab.on{background:var(--bub);border-color:var(--bub);color:var(--bubfg)}
.scard{flex:1;overflow-y:auto;padding:14px 16px;scrollbar-width:thin;min-height:0}
.scard .st{font-size:15px;font-weight:700;letter-spacing:-.01em}
.scard .st a{color:inherit;text-decoration:none}
.scard .st a:hover{color:var(--acc)}
.scard .sv{font-size:12.5px;color:var(--mut);margin:3px 0 10px}
.frow{margin:0 0 10px}
.flab{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.fval{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.fval li{margin:0 0 4px}
.fval ul{margin:0;padding-left:16px}
.tchip{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--ring);
  border-radius:999px;padding:1px 9px;margin:0 3px 3px 0;color:var(--ink2)}
.scard details summary{cursor:pointer;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.scard details p{font-size:12.5px;line-height:1.55;color:var(--ink2);margin:4px 0 0}

/* ---- derivation tree: the gap scan's working shown, not told ---- */
.gt{background:var(--card);border:1px solid var(--ring);border-radius:12px;
  padding:14px 16px;margin:10px 0;white-space:normal}
.gt .gth{font-size:15px;font-weight:700}
.gt .gth em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--mut);margin-left:8px}
.gbr{border-top:1px solid var(--ring);padding:9px 0 8px}
.gbr summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:9px}
.gbr summary::-webkit-details-marker{display:none}
.gbr .gterm{font-weight:650;font-size:14.5px}
.gbr .gnum{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);white-space:nowrap}
.gbr .gbar{flex:1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;min-width:60px;align-self:center}
.gbr .gbar i{display:block;height:100%;background:color-mix(in srgb,var(--hb) 70%,var(--mut))}
.gbr.gap0 .gterm{color:var(--no)}
.gbr.gap0 .gbar i{background:color-mix(in srgb,var(--hp) 80%,var(--no))}
.gcap{font-size:10.5px;letter-spacing:.04em;color:var(--no);font-weight:700;
  border:1px solid color-mix(in srgb,var(--no) 45%,var(--ring));border-radius:5px;padding:0 6px}
.gbody{margin:8px 0 2px;padding-left:2px}
.grep{font-size:14px;line-height:1.7;margin:0 0 7px}
.grep i{font-style:normal;background:color-mix(in srgb,var(--hp) 42%,transparent);
  padding:1px 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gset{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:6px 0 3px}
.gnote{font-size:12px;color:var(--mut);margin-top:9px;border-top:1px solid var(--ring);padding-top:7px}

/* ---- settings ---- */
.set{max-width:640px;margin:0 auto;padding:34px 20px}
.set h1{font-size:24px;letter-spacing:-.01em;margin:0 0 20px}
.sgrp{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:4px 16px;margin:0 0 16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--ring)}
.srow:last-child{border-bottom:0}
.srow .sl b{display:block;font-size:15px;font-weight:650}
.srow .sl span{font-size:13px;color:var(--mut)}
.seg{display:flex;background:var(--bg);border:1px solid var(--ring);border-radius:9px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--mut);
  padding:5px 12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--bub);color:var(--bubfg)}
.astat{font-size:13px;color:var(--mut);text-align:right}
.astat i{font-style:normal;color:var(--ok);font-weight:700;margin-right:5px}
.astat.off i{color:var(--mut)}

/* ---- language toggle, top right ---- */
.lang{position:fixed;top:10px;right:12px;z-index:5;display:flex;background:var(--card);
  border:1px solid var(--ring);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:12px;font-weight:650;letter-spacing:.03em;border:0;
  background:none;color:var(--mut);padding:4px 9px;cursor:pointer}
.lang button.on{background:var(--bub);color:var(--bubfg)}

/* ---- composer ---- */
.dock{padding:10px 20px 18px}
.dock .cin{max-width:800px;margin:0 auto;position:relative}
#q{width:100%;font:inherit;font-size:16.5px;padding:15px 56px 15px 18px;border-radius:13px;
  border:1px solid var(--ring);outline:none;background:var(--card);color:var(--ink);
  box-shadow:0 1px 4px rgba(20,24,30,.05)}
#q:focus{border-color:var(--acc)}
#go{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border-radius:10px;border:0;background:var(--bub);color:var(--bubfg);cursor:pointer;font-size:15px}
#go[disabled]{opacity:.35;cursor:default}

/* ---- empty state: the composer holds the middle of the screen ---- */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 20px 8vh}
.hero .cin{width:min(720px,100%);position:relative}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.ex button{font:inherit;font-size:12.5px;color:var(--ink2);background:var(--card);
  border:1px solid var(--ring);border-radius:999px;padding:6px 14px;cursor:pointer}
.ex button:hover{border-color:var(--acc)}
</style></head><body>
<div class="app">
  <nav class="rail">
    <div class="mark"><i></i><i></i><i></i><span>Bellwether<em>AI research</em></span></div>
    <button class="newq" id="newq">새 질문</button>
    <div class="hist" id="hist"></div>
    <div class="railfoot"><a href="#" id="settingsbtn">⚙ Settings</a></div>
  </nav>
  <div class="main" id="main"></div>
  <aside class="side" id="side"></aside>
</div>
<button class="menubtn" id="menubtn">☰</button>
<div class="lang"><button data-l="ko">KO</button><button data-l="en">EN</button></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CHAT=null, BUSY=false;

// ---- UI language: paper content stays in its own words; only chrome flips
const STR={
 ko:{newq:'새 질문', browse:'29,605편 둘러보기 →', today:'오늘', etal:' 외',
     steps:n=>`${n} steps`, papers:'Papers', settings:'⚙ 설정', sTitle:'설정',
     sAgents:'에이전트', sAgentD:'질문에 답하는 코딩 에이전트 — 이 컴퓨터에 로그인된 계정을 그대로 사용',
     sTheme:'테마', sLight:'라이트', sDark:'다크', sSystem:'시스템',
     sLang:'언어', sProgram:'프로그램', sIn:'연결됨', sOut:'미설치',
     sDefault:'기본', sBeta:'베타', sCorpus:'코퍼스', sAddr:'주소',
     delQ:'이 대화를 삭제할까요?', renQ:'대화 이름'},
 en:{newq:'New question', browse:'Browse 29,605 papers →', today:'Today', etal:' et al.',
     steps:n=>`${n} steps`, papers:'Papers', settings:'⚙ Settings', sTitle:'Settings',
     sAgents:'Agents', sAgentD:'The coding agent that answers — uses the account signed in on this machine',
     sTheme:'Theme', sLight:'Light', sDark:'Dark', sSystem:'System',
     sLang:'Language', sProgram:'Program', sIn:'connected', sOut:'not installed',
     sDefault:'default', sBeta:'beta', sCorpus:'Corpus', sAddr:'Address',
     delQ:'Delete this conversation?', renQ:'Conversation name'}};
let LANG=localStorage.getItem('wn_lang')||'ko';
const t=k=>STR[LANG][k];
function applyLang(){
  document.documentElement.lang=LANG;
  $('#newq').textContent=t('newq');
  $('#settingsbtn').textContent=t('settings');
  document.querySelectorAll('.lang button').forEach(b=>
    b.classList.toggle('on',b.dataset.l===LANG));
}

// ---- theme: light / dark / system, orx-style, persisted
let THEME=localStorage.getItem('wn_theme')||'system';
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const dark=THEME==='dark'||(THEME==='system'&&mq.matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
mq.addEventListener('change',applyTheme);

// ---- agent choice: which signed-in CLI answers
let AGENT=localStorage.getItem('wn_agent')||'claude';
let AGENTS=null;
async function loadAgents(){
  try{ AGENTS=await (await fetch('/agents')).json(); }catch(e){ AGENTS={}; }
  if($('.set'))showSettings();
}

// ---- settings view (replaces the thread; New question leaves it)
function showSettings(){
  if(AGENTS===null){ loadAgents(); }
  const A=AGENTS||{};
  const arow=(k,label,beta)=>{
    const a=A[k]||{};
    const st=a.installed
      ?`<span class="astat"><i>✓</i>${esc(a.account||t('sIn'))}</span>`
      :`<span class="astat off"><i>·</i>${t('sOut')}</span>`;
    return `<div class="srow"><div class="sl"><b>${label}${beta?` <span style="color:var(--mut);font-weight:500">(${t('sBeta')})</span>`:''}</b>${st}</div>
      <div class="seg"><button data-ag="${k}" class="${AGENT===k?'on':''}" ${a.installed?'':'disabled'}>${t('sDefault')}</button></div></div>`;
  };
  $('#main').innerHTML=`<div class="thread"><div class="set">
    <h1>${t('sTitle')}</h1>
    <div class="sgrp">
      <div class="srow"><div class="sl"><b>${t('sAgents')}</b><span>${t('sAgentD')}</span></div></div>
      ${arow('claude','Claude Code',false)}
      ${arow('codex','Codex',true)}
    </div>
    <div class="sgrp">
      <div class="srow"><div class="sl"><b>${t('sTheme')}</b></div>
        <div class="seg">${['light','dark','system'].map(x=>
          `<button data-th="${x}" class="${THEME===x?'on':''}">${t('s'+x[0].toUpperCase()+x.slice(1))}</button>`).join('')}</div></div>
      <div class="srow"><div class="sl"><b>${t('sLang')}</b></div>
        <div class="seg"><button data-lg="ko" class="${LANG==='ko'?'on':''}">한국어</button>
          <button data-lg="en" class="${LANG==='en'?'on':''}">English</button></div></div>
    </div>
    <div class="sgrp">
      <div class="srow"><div class="sl"><b>${t('sCorpus')}</b><span>ICML 2025/26 · NeurIPS 2024/25 · ICLR 2025/26</span></div>
        <span class="astat">29,605 papers</span></div>
      <div class="srow"><div class="sl"><b>${t('sAddr')}</b></div>
        <span class="astat">${esc(location.origin)}</span></div>
    </div>
  </div></div>`;
  markHist();
  $('#main').querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{
    AGENT=b.dataset.ag; localStorage.setItem('wn_agent',AGENT); showSettings(); });
  $('#main').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{
    THEME=b.dataset.th; localStorage.setItem('wn_theme',THEME); applyTheme(); showSettings(); });
  $('#main').querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{
    if(b.dataset.lg!==LANG){ LANG=b.dataset.lg; localStorage.setItem('wn_lang',LANG); applyLang(); loadHist(); showSettings(); } });
}
function setLang(l){
  if(BUSY||l===LANG)return;
  LANG=l; localStorage.setItem('wn_lang',l);
  applyLang(); loadHist();
  if(!$('#tin'))showEmpty();
  else if(CHAT)fetch('/chats/'+CHAT).then(r=>r.json())
    .then(d=>{CHAT=d.id;showThread(d.turns);}).catch(()=>{});
}

function composerHTML(){return `<div class="cin">
  <input id="q" autocomplete="off">
  <button id="go" aria-label="ask">↑</button></div>`;}

function heroHTML(){
  return `<div class="hero">
    ${composerHTML()}
  </div>`;
}
function threadHTML(){
  return `<div class="thread"><div class="tin" id="tin"></div></div>
    <div class="dock">${composerHTML()}</div>`;
}

function citeHTML(s){
  const role=s.v&&('LKR'.includes(s.role))?' r'+s.role:'';
  return `<button class="cite ${s.v?'ok':'no'}${role}" data-pg="${s.gid}"
    title="${esc(s.q)}"><b>${s.v?'✓':'✗'}</b>${esc((s.venue||'')+' '+(s.year||''))} · ${esc(s.title)}</button>`;
}
// ---- right panel: every paper the agent touched, as the structured record
// it actually read (get_paper's fields), one tab per paper
const PCACHE={};
let PAPERS=[], PACTIVE=null;
async function addPaper(g){
  g=+g; if(!g||PAPERS.includes(g))return;
  PAPERS.push(g);                      // claim the slot BEFORE the await —
  if(!PCACHE[g]){                      // concurrent adds of one gid raced here
    try{ PCACHE[g]=await (await fetch('/paper/'+g)).json(); }
    catch(e){ PAPERS=PAPERS.filter(x=>x!==g); return; }
  }
  if(PCACHE[g].error){ PAPERS=PAPERS.filter(x=>x!==g); return; }
  if(PACTIVE===null)PACTIVE=g;
  renderSide();
}
function clearSide(){ PAPERS=[]; PACTIVE=null; renderSide(); }
function frow(lab,val){ return val?`<div class="frow"><div class="flab">${lab}</div><div class="fval">${val}</div></div>`:''; }
function renderSide(){
  const el=$('#side');
  document.querySelector('.app').classList.toggle('wside',PAPERS.length>0);
  if(!PAPERS.length){ el.innerHTML=''; return; }
  const tabs=PAPERS.map(g=>{const d=PCACHE[g];
    return `<button class="ptab ${g===PACTIVE?'on':''}" data-pt="${g}" title="${esc(d.title)}">${esc(d.title)}</button>`;}).join('');
  const d=PCACHE[PACTIVE];
  const au=(d.authors||[]).join(', ')+(d.n_authors>3?STR[LANG].etal:'');
  el.innerHTML=`<div class="shd">${STR[LANG].papers}<b>${PAPERS.length}</b></div>
    <div class="ptabs">${tabs}</div>
    <div class="scard">
      <div class="st"><a href="/browse#p${d.gid}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
      <div class="sv">${esc(d.venue+' '+d.year)}${au?' · '+esc(au):''}${d.subarea?' · '+esc(d.subarea):''}</div>
      ${frow('limitation',d.L?esc(d.L):'')}
      ${frow('key_change',d.K?esc(d.K):'')}
      ${frow('result_claim',d.R?esc(d.R):'')}
      ${(d.novelty&&d.novelty.length>1)?frow('novelty_spans','<ul>'+d.novelty.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'):''}
      ${(d.topics&&d.topics.length)?frow('topics',d.topics.map(t=>`<span class="tchip">${esc(t)}</span>`).join('')):''}
      ${d.abstract?`<details><summary>abstract</summary><p>${esc(d.abstract)}</p></details>`:''}
    </div>`;
  el.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PACTIVE=+b.dataset.pt;renderSide();});
}

// a cite chip unfolds the paper's highlight card right here — the same
// three-colour passage the browse cards carry
async function toggleCard(btn){
  const g=btn.dataset.pg;
  const open=btn.nextElementSibling;
  if(open&&open.classList.contains('pcard')){ open.remove(); return; }
  if(!PCACHE[g]){
    try{ PCACHE[g]=await (await fetch('/paper/'+g)).json(); }
    catch(e){ return; }
  }
  const d=PCACHE[g];
  if(d.error)return;
  const pass=['L','K','R'].map(k=>d[k]?`<i class="w${k}">${esc(d[k])}</i>`:'').filter(Boolean).join(' ');
  const au=(d.authors||[]).join(', ')+(d.n_authors>3?STR[LANG].etal:'');
  btn.insertAdjacentHTML('afterend',
    `<div class="pcard"><div class="pt"><a href="/browse#p${g}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
     <div class="pv"><b>${esc(d.venue+' '+d.year)}</b>${au?' · '+esc(au):''}</div>
     <div class="pass">${pass}</div></div>`);
}
const md=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
// ---- the derivation tree: branches = failures the field names, split into
// namers vs attackers; an unattacked branch IS the gap candidate
function chipOf(g){
  const d=PCACHE[g];
  const lab=d&&d.title?`${d.venue} ${d.year} · ${d.title}`:('gid '+g);
  return `<button class="cite" data-pg="${g}" title="">${esc(lab)}</button>`;
}
function treeHTML(tr){
  const mx=Math.max(...tr.branches.map(b=>b.named_by),1);
  const rows=tr.branches.map(b=>{
    const gap=b.attacked_by===0;
    const atk=(b.attackers||[]).map(chipOf).join('');
    const nam=(b.namers||[]).map(chipOf).join('');
    const yrs=Object.entries(b.by_year).map(([y,n])=>`${y}:${n}`).join(' ');
    return `<details class="gbr ${gap?'gap0':''}">
      <summary><span class="gterm">${esc(b.term)}</span>
        <span class="gbar"><i style="width:${(b.named_by/mx*100).toFixed(0)}%"></i></span>
        <span class="gnum">${b.named_by} named · ${b.attacked_by} attacked · ${esc(yrs)}</span>
        ${gap?`<span class="gcap">GAP?</span>`:''}</summary>
      <div class="gbody">
        <div class="grep"><i>${esc(b.rep.sentence)}</i></div>
        ${atk?`<div class="gset">attacked by</div><div class="bcites">${atk}</div>`:''}
        ${nam?`<div class="gset">named, not attacked</div><div class="bcites">${nam}</div>`:''}
      </div></details>`;
  }).join('');
  return `<div class="gt"><div class="gth">${esc(tr.field)}
      <em>${tr.papers_in_field} papers · ${tr.with_limitation} state a limitation</em></div>
    ${rows}<div class="gnote">${esc(tr.note)}</div></div>`;
}
async function hydrateTree(el,tr){
  const gids=new Set();
  for(const b of tr.branches){ (b.attackers||[]).forEach(g=>gids.add(g)); (b.namers||[]).forEach(g=>gids.add(g)); gids.add(b.rep.gid); }
  await Promise.all([...gids].map(async g=>{
    if(!PCACHE[g]){ try{PCACHE[g]=await (await fetch('/paper/'+g)).json();}catch(e){} }
  }));
  el.querySelectorAll('.cite[data-pg]').forEach(bt=>{
    const d=PCACHE[+bt.dataset.pg];
    if(d&&d.title){ bt.textContent=`${d.venue} ${d.year} · ${d.title}`; }
  });
}
function aHTML(t){
  const body=t.segs.map(s=>s.t==='p'?md(s.s):citeHTML(s)).join('');
  const v=t.verified||{checked:0,passed:0};
  const foot=v.checked?`<div class="afoot"><span class="${v.passed===v.checked?'vok':'vno'}">
    ${v.passed===v.checked?'✓':'✗'} ${v.passed}/${v.checked}</span></div>`:'';
  const trail=(t.trail&&t.trail.length)?`<details class="trail"><summary>${STR[LANG].steps(t.trail.length)}</summary>
    ${t.trail.map(x=>`<div>${esc(x)}</div>`).join('')}</details>`:'';
  const trees=(t.trees||[]).map(treeHTML).join('');
  return `<div class="amsg">${body}</div>${trees}${foot}${trail}`;
}
function turnHTML(t){
  return `<div class="qmsg"><div>${esc(t.q)}</div></div>`+aHTML(t);
}

function wireComposer(){
  const q=$('#q'), go=$('#go');
  if(!q)return;
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)send(q.value);});
  go.onclick=()=>send(q.value);
  q.focus();
}

function showEmpty(){
  CHAT=null; clearSide();
  $('#main').innerHTML=heroHTML();
  wireComposer(); markHist();
}
function showThread(turns){
  clearSide();
  $('#main').innerHTML=threadHTML();
  $('#tin').innerHTML=turns.map(turnHTML).join('');
  wireComposer(); markHist();
  for(const t of turns)for(const s of (t.segs||[]))if(s.t==='c')addPaper(s.gid);
  const tin=$('#tin');
  turns.forEach(t=>(t.trees||[]).forEach(tr=>hydrateTree(tin,tr)));
  const th=$('.thread'); th.scrollTop=th.scrollHeight;
}

async function send(text){
  const v=(text||'').trim();
  if(!v||BUSY)return;
  BUSY=true;
  if(!$('#tin')){ $('#main').innerHTML=threadHTML(); wireComposer(); }
  const q=$('#q'), go=$('#go'); q.value=''; go.disabled=true;
  const tin=$('#tin');
  tin.insertAdjacentHTML('beforeend',
    `<div class="qmsg"><div>${esc(v)}</div></div><div id="pend"></div>`);
  const pend=$('#pend'), th=$('.thread'); th.scrollTop=th.scrollHeight;
  const trail=[], trees=[];
  let draftRaw='';
  const line=msg=>{pend.insertAdjacentHTML('beforeend',
    `<div class="live"><i></i>${esc(msg)}</div>`); th.scrollTop=th.scrollHeight;};
  const draftEl=()=>{ let d2=pend.querySelector('.draft');
    if(!d2){ pend.insertAdjacentHTML('beforeend','<div class="draft"></div>'); d2=pend.querySelector('.draft'); }
    return d2; };
  line('…');
  try{
    const r=await fetch('/chat/stream',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q:v,chat:CHAT,agent:AGENT})});
    const rd=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await rd.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        if(!chunk.startsWith('data: '))continue;
        const ev=JSON.parse(chunk.slice(6));
        if(ev.t==='tool'){ const s=ev.name+(ev.arg?'  '+ev.arg:''); trail.push(s); line(s);
          if(ev.name==='get_paper')addPaper(ev.arg); }
        else if(ev.t==='d'){ draftRaw+=ev.s;
          draftEl().textContent=draftRaw.replace(/⟦[^⟧]*⟧?/g,'');
          th.scrollTop=th.scrollHeight; }
        else if(ev.t==='tree'){ trees.push(ev.tree);
          pend.insertAdjacentHTML('beforebegin',treeHTML(ev.tree));
          const el=pend.previousElementSibling; hydrateTree(el,ev.tree);
          th.scrollTop=th.scrollHeight; }
        else if(ev.t==='error'){ pend.outerHTML=`<div class="errmsg">${esc(ev.error)}</div>`; }
        else if(ev.t==='done'){
          CHAT=ev.chat;
          pend.outerHTML=aHTML({segs:ev.segs,verified:ev.verified,trail});
          for(const s of ev.segs)if(s.t==='c')addPaper(s.gid);
          loadHist();
        }
      }
    }
  }catch(e){ const p=$('#pend'); if(p)p.outerHTML=`<div class="errmsg">${esc(String(e))}</div>`; }
  BUSY=false;
  const go2=$('#go'); if(go2)go2.disabled=false;
  const q2=$('#q'); if(q2)q2.focus();
  th.scrollTop=th.scrollHeight;
}

function markHist(){
  document.querySelectorAll('.hrow').forEach(el=>
    el.classList.toggle('on',el.dataset.id===CHAT));
}
async function loadHist(){
  try{
    const rows=await (await fetch('/chats')).json();
    const day=ts=>new Date(ts*1000).toLocaleDateString();
    const today=day(Date.now()/1000);
    let h='',grp=null;
    for(const r of rows){
      const g=day(r.ts)===today?t('today'):day(r.ts);
      if(g!==grp){ h+=`<div class="hgrp">${esc(g)}</div>`; grp=g; }
      h+=`<div class="hwrap"><button class="hrow" data-id="${esc(r.id)}">${esc(r.title)}</button>
        <span class="hact"><button data-rn="${esc(r.id)}" title="rename">✎</button>
        <button data-del="${esc(r.id)}" title="delete">✕</button></span></div>`;
    }
    $('#hist').innerHTML=h;
    document.querySelectorAll('.hrow').forEach(el=>el.onclick=async()=>{
      if(BUSY)return;
      const d=await (await fetch('/chats/'+el.dataset.id)).json();
      CHAT=d.id; showThread(d.turns);
      document.querySelector('.rail').classList.remove('open');
    });
    document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async e=>{
      e.stopPropagation();
      if(BUSY||!confirm(t('delQ')))return;
      await fetch('/chats/'+el.dataset.del,{method:'DELETE'});
      if(CHAT===el.dataset.del)showEmpty();
      loadHist();
    });
    document.querySelectorAll('[data-rn]').forEach(el=>el.onclick=async e=>{
      e.stopPropagation();
      const cur=el.closest('.hwrap').querySelector('.hrow').textContent;
      const v=prompt(t('renQ'),cur);
      if(v===null||!v.trim())return;
      await fetch('/chats/'+el.dataset.rn,{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v.trim()})});
      loadHist();
    });
    markHist();
  }catch(e){}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.cite[data-pg]');
  if(b)toggleCard(b);
});
$('#newq').onclick=()=>{ if(!BUSY)showEmpty(); };
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#settingsbtn').onclick=e=>{ e.preventDefault(); if(!BUSY)showSettings();
  document.querySelector('.rail').classList.remove('open'); };
$('#menubtn').onclick=()=>document.querySelector('.rail').classList.toggle('open');
applyTheme(); applyLang(); showEmpty(); loadHist();
</script></body></html>
